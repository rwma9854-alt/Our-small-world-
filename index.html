yes.onclick=()=>{const g=$('#gate');g.classList.add('yes');$('#gb').style.display='none';$('#gq').style.display='none';$('#mt').style.display='block';
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)for(let i=0;i<26;i++){const h=document.createElement('span');h.className='fh';h.textContent=['❤️','💗','🤍','💕'][i%4];h.style.cssText=`--x:${Math.random()*460-230}px;--y:${-260-Math.random()*300}px;--r:${Math.random()*80-40}deg;animation-delay:${Math.random()*.6}s`;g.appendChild(h)}
 setTimeout(()=>g.classList.add('fade'),1800);setTimeout(()=>{g.classList.add('dead');$('#auth').classList.remove('dead')},2400)}}
const aud=new Audio(),mus=$('#mus');aud.loop=true;aud.volume=.6;let musPath='';
function musUI(){mus.textContent=aud.paused?'🔇':'🎵';mus.setAttribute('aria-label',aud.paused?'تشغيل الأغنية':'إيقاف الأغنية')}
aud.onplay=aud.onpause=musUI;
mus.onclick=async()=>{if(!musPath)return toast('ضيفي أغنية من ⚙️ الإعدادات الأول 🎵');if(aud.paused){localStorage.musicOff='';try{await aud.play()}catch(e){onerr(e)}}else{aud.pause();localStorage.musicOff='1'}};
async function musSync(){const it=items.find(i=>i.kind=='bgsong'),p=it?.data.path||'';if(p==musPath)return;musPath=p;
 if(!p){aud.pause();aud.removeAttribute('src');musUI();return}
 const r=await sb.storage.from('photos').createSignedUrl(p,21600);if(r.error)throw r.error;aud.src=r.data.signedUrl;
 if(!localStorage.musicOff)('#q').onchange=e=>{q=e.target.value;listView()};if($('#cat'))$('#cat').onchange=e=>{cat=e.target.value;listView()};
 $('#add').onclick=()=>edit();
 if(S.jar)$('#jar').onclick=()=>{if(!L.length)return toast('ضيفوا رسائل الأول 💌');const m=L[Math.random()*L.length|0];
  $('#out').innerHTML=`<div id="heart">💖</div><p>${esc(m.body||m.title)}</p><button data-fav="${m.id}">${m.fav?'💔 شيل من المفضلة':'⭐ حفظ في المفضلة'}</button> <button class="ghost" id="more">رسالة تانية</button>`;$('#more').onclick=()=>$('#jar').click()};
 v.onclick=async e=>{const b=e.target.closest('[data-id],[data-fav],[data-del],[data-open],[data-chk],[data-rx]');if(!b)return;const D=b.dataset;
  try{if(D.fav){const i=items.find(x=>x.id==D.fav);await up(i.id,{fav:!i.fav})}
  else if(D.del){if(confirm('متأكدين من الحذف؟')){const i=items.find(x=>x.id==D.del);if(i.data.path)await sb.storage.from('photos').remove([i.data.path]);const r=await sb.from('items').delete().eq('id',D.del);if(r.error)throw r.error;toast('اتحذف')}}
  else if(D.id)edit(items.find(x=>x.id==D.id));
  else if(D.chk){const i=items.find(x=>x.id==D.chk);await up(i.id,{done:!i.done})}
  else if(D.rx){const i=items.find(x=>x.id==D.rx);await up(i.id,{data:{...i.data,rx:(i.data.rx||0)+1}});toast('💗')}
  else if(D.open){const i=items.find(x=>x.id==D.open);await up(i.id,{data:{...i.data,opened:1}})}}catch(e){onerr(e)}};
 L.filter(i=>i.data.path).forEach(async i=>{if(!urls[i.data.path]){const r=await sb.storage.from('photos').createSignedUrl(i.data.path,3600);if(r.data){urls[i.data.path]=r.data.signedUrl;const im=document.querySelector(`[data-ph="${i.id}"]`);if(im)im.src=r.data.signedUrl}}})}
async function up(id,p){const r=await sb.from('items').update(p).eq('id',id);if(r.error)throw r.error;toast('اتحفظ ✅');load()}
function card(i){const S=SECS[tab],d=i.data;
 if(S.photo)return`<div><img data-ph="${i.id}" src="${urls[d.path]||''}" alt="${esc(i.title)}" data-id="${i.id}"></div>`;
 const hidden=S.letter&&d.surprise&&i.created_by!=me&&!d.opened;
 return`<div class="card"><div class="row"><b style="flex:1">${S.check?`<input type="checkbox" style="width:auto" ${i.done?'checked':''} data-chk="${i.id}"> `:''}${esc(i.title)}</b><span class="muted">${esc(i.category||'')}</span></div>
 ${hidden?`<button data-open="${i.id}">🎁 مفاجأة لك — افتح</button>`:`<p style="white-space:pre-wrap">${esc(i.body)}</p>`}
 ${i.date?`<div class="muted">📅 ${new Date(i.date).toLocaleDateString('ar-EG')}</div>`:''}
 ${d.budget?`<div class="muted">💰 ${esc(d.budget)}</div>`:''}${d.draft?'<div class="muted">📝 مسودة</div>':''}
 ${d.link&&/^https?:\/\//.test(d.link)?`<a href="${esc(d.link)}" target="_blank" rel="noopener">🔗 افتح</a>`:''}
 <div class="muted">بقلم: ${esc(i.created_by)} • ${new Date(i.created_at).toLocaleDateString('ar-EG')}</div>
 <div class="row"><button data-fav="${i.id}">${i.fav?'⭐':'☆'}</button><button data-rx="${i.id}">💗 ${d.rx||0}</button><button class="ghost" data-id="${i.id}">تعديل</button><button class="ghost" data-del="${i.id}">حذف</button></div></div>`}
function edit(i){const S=SECS[tab],d=i?.data||{},dl=$('#dlg'),f=$('#f');
 f.innerHTML=`<h2>${i?'تعديل':'إضافة'}</h2><input name="title" placeholder="${S.ph||'العنوان'}" value="${esc(i?.title)}" required>
 ${S.photo?'<input type="file" name="file" accept="image/*">':`<textarea name="body" rows="5" placeholder="الكلام...">${esc(i?.body)}</textarea>`}
 ${S.cats.length?`<select name="category">${S.cats.map(c=>`<option ${i?.category==c?'selected':''}>${c}</option>`).join('')}</select>`:''}
 ${S.date?`<input type="datetime-local" name="date" value="${i?.date?new Date(new Date(i.date)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):''}">`:''}
 ${S.link?`<input name="link" type="url" placeholder="رابط (اختياري)" value="${esc(d.link)}">`:''}${S.budget?`<input name="budget" placeholder="تكلفة تقريبية" value="${esc(d.budget)}">`:''}
 ${S.letter?`<label><input type="checkbox" name="surprise" style="width:auto" ${d.surprise?'checked':''}> مفاجأة للطرف التاني</label><label><input type="checkbox" name="draft" style="width:auto" ${d.draft?'checked':''}> مسودة</label>`:''}
 <div class="row"><button id="ok">حفظ</button><button type="button" class="ghost" id="no">إلغاء</button></div>`;
 dl.showModal();$('#no').onclick=()=>dl.close();
 f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),btn=$('#ok');btn.disabled=true;
  try{const data={...d};['link','budget'].forEach(k=>{if(fd.has(k))data[k]=fd.get(k)});if(S.letter){data.surprise=fd.has('surprise');data.draft=fd.has('draft')}
   const file=fd.get('file');if(file&&file.size){data.path=await upload(file);if(i?.data.path)await sb.storage.from('photos').remove([i.data.path])}
   else if(S.photo&&!i)throw new Error('اختاروا صورة');
   const row={title:fd.get('title'),body:fd.get('body')||null,category:fd.get('category')||null,date:fd.get('date')?new Date(fd.get('date')).toISOString():null,data};
   const r=i?await sb.from('items').update(row).eq('id',i.id):await sb.from('items').insert({...row,kind:tab,created_by:me});
   if(r.error)throw r.error;dl.close();toast('اتحفظ ✅ وظهر عند التاني');load()}catch(e){onerr(e)}btn.disabled=false}}
async function upload(file){const bmp=await createImageBitmap(file),s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
 c.width=bmp.width*s;c.height=bmp.height*s;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82)),path=crypto.randomUUID()+'.jpg';
 const r=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;return path}
function settingsView(){const loc=x=>x?new Date(new Date(x)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 $('#view').innerHTML=`<h1>⚙️ الإعدادات</h1><form class="card" id="sf"><label>بداية علاقتنا (تاريخ ووقت)</label><input type="datetime-local" name="s" value="${loc(st.start_at)}">
 <label>رسالة الترحيب</label><input name="w" value="${esc(st.welcome)}"><label>مناسبة جاية (اسم)</label><input name="en" value="${esc(st.event_name)}">
 <label>تاريخ المناسبة</label><input type="datetime-local" name="e" value="${loc(st.event_at)}"><button>حفظ</button></form>
 <div class="card"><button id="bk">⬇️ نسخة احتياطية (JSON)</button> <button class="ghost" id="lo">تسجيل خروج</button><p class="muted">نسيتوا كلمة السر؟ من Supabase: Authentication ← Users ← ⋯ ← Send password recovery.</p></div>`;
 $('#sf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),t=x=>x?new Date(x).toISOString():null;
  const r=await sb.from('settings').update({start_at:t(f.get('s')),welcome:f.get('w'),event_name:f.get('en'),event_at:t(f.get('e'))}).eq('id',1);r.error?onerr(r.error):(toast('اتحفظ ✅'),load())};
 $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:st,items},null,1)]));a.download='backup.json';a.click()};
 $('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()}}
boot();
</script></body></html>
