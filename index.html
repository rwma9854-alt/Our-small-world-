function qaView(){const v=$('#view'),L=items.filter(i=>i.kind=='qa').sort((a,b)=>(b.category||'').localeCompare(a.category||'')||new Date(b.created_at)-new Date(a.created_at));
 v.innerHTML=`<h1>${SECS.qa.n}</h1><button id="add">＋ سؤال جديد</button>${L.length?'':'<div class="card muted">لسه مفيش أسئلة… ضيفوا أول سؤال لشهر 💗</div>'}`+L.map(i=>{const a=i.data.answers||{},mine=a[me]||'',others=Object.entries(a).filter(([k,t])=>k!=me&&t);
 return`<div class="card"><div class="muted">📅 ${esc(i.category||'')}</div><b>${esc(i.title)}</b><textarea data-ans="${i.id}" rows="3" placeholder="إجابتك...">${esc(mine)}</textarea><div class="row"><button data-save="${i.id}">حفظ إجابتي</button>${i.created_by==me?`<button class="ghost" data-del="${i.id}">حذف السؤال</button>`:''}</div>${others.map(([k,t])=>mine?`<p>💬 <b>${esc(k)}:</b> ${esc(t)}</p>`:`<p class="muted">💬 ${esc(k)} جاوب — جاوبي الأول علشان تشوفي إجابته 🤍</p>`).join('')}</div>`}).join('');
 $('#add').onclick=qaAdd;
 v.onclick=async e=>{const b=e.target.closest('[data-save],[data-del]');if(!b)return;try{if(b.dataset.save){const i=items.find(x=>x.id==b.dataset.save),t=v.querySelector(`[data-ans="${i.id}"]`).value.trim();await up(i.id,{data:{...i.data,answers:{...(i.data.answers||{}),[me]:t}}})}else if(items.find(x=>x.id==b.dataset.del).created_by!=me)toast('السؤال ده كتبه حد تاني 💗');else if(confirm('متأكدين من حذف السؤال؟')){const r=await sb.from('items').delete().eq('id',b.dataset.del);if(r.error)throw r.error;toast('اتحذف')}}catch(x){onerr(x)}}}
function qaAdd(){const dl=$('#dlg'),f=$('#f');
 f.innerHTML=`<h2>سؤال الشهر</h2><input type="month" name="m" value="${new Date().toISOString().slice(0,7)}" required><textarea name="t" rows="3" placeholder="اكتبي سؤالك..." required></textarea><button type="button" class="ghost" id="sg">💡 اقتراح سؤال (تقدري تعدّليه)</button><div class="row"><button id="ok">حفظ</button><button type="button" class="ghost" id="no">إلغاء</button></div>`;
 dl.showModal();$('#no').onclick=()=>dl.close();$('#sg').onclick=()=>{f.t.value=QS[Math.random()*QS.length|0]};
 f.onsubmit=async e=>{e.preventDefault();const r=await sb.from('items').insert({kind:'qa',category:f.m.value,title:f.t.value,data:{answers:{}},created_by:me});if(r.error)return onerr(r.error);dl.close();toast('اتحفظ ✅');load()}}
function settingsView(){const loc=x=>x?new Date(new Date(x)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 $('#view').innerHTML=`<h1>⚙️ الإعدادات</h1><form class="card" id="sf"><label>بداية علاقتنا (تاريخ ووقت)</label><input type="datetime-local" name="s" value="${loc(st.start_at)}">
 <label>رسالة الترحيب</label><input name="w" value="${esc(st.welcome)}"><label>مناسبة جاية (اسم)</label><input name="en" value="${esc(st.event_name)}">
 <label>تاريخ المناسبة</label><input type="datetime-local" name="e" value="${loc(st.event_at)}"><button>حفظ</button></form>
 <div class="card"><b>🎵 أغنية الخلفية</b><p class="muted">ارفعي ملف صوت (mp3) لحد 45 ميجا، وهتشتغل أول ما تدخلوا. ${musPath?'✅ فيه أغنية محفوظة':'لسه مفيش أغنية'}</p><input type="file" id="sf2" accept="audio/*"><div class="row"><button id="sup">رفع الأغنية</button>${musPath?'<button class="ghost" id="sdel">حذف الأغنية</button>':''}</div></div>
 <div class="card"><button id="bk">⬇️ نسخة احتياطية (JSON)</button> <button class="ghost" id="lo">تسجيل خروج</button><p class="muted">نسيتوا كلمة السر؟ من Supabase: Authentication ← Users ← ⋯ ← Send password recovery.</p></div>`;
 $('#sf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),t=x=>x?new Date(x).toISOString():null;
  const r=await sb.from('settings').update({start_at:t(f.get('s')),welcome:f.get('w'),event_name:f.get('en'),event_at:t(f.get('e'))}).eq('id',1);r.error?onerr(r.error):(toast('اتحفظ ✅'),load())};
 $('#sup').onclick=async()=>{const f=$('#sf2').files[0];if(!f)return toast('اختاري ملف الأول');if(f.size>45*1024*1024)return toast('الملف أكبر من 45 ميجا');
 try{const p=crypto.randomUUID()+'.'+((f.name.split('.').pop()||'mp3').toLowerCase());let r=await sb.storage.from('photos').upload(p,f,{contentType:f.type||'audio/mpeg'});if(r.error)throw r.error;
  const old=items.find(i=>i.kind=='bgsong');
  if(old){r=await sb.from('items').update({data:{path:p}}).eq('id',old.id);if(r.error)throw r.error;await sb.storage.from('photos').remove([old.data.path])}
  else{r=await sb.from('items').insert({kind:'bgsong',title:'bgsong',data:{path:p},created_by:me});if(r.error)throw r.error}
  localStorage.musicOff='';toast('اتحفظت 🎵');load()}catch(e){onerr(e)}};
 if($('#sdel'))$('#sdel').onclick=async()=>{if(!confirm('حذف الأغنية؟'))return;try{const old=items.find(i=>i.kind=='bgsong');await sb.storage.from('photos').remove([old.data.path]);const r=await sb.from('items').delete().eq('id',old.id);if(r.error)throw r.error;toast('اتحذفت');load()}catch(e){onerr(e)}};
 $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:st,items},null,1)]));a.download='backup.json';a.click()};
 $('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()}}
setInterval(()=>{if(tab=='letters'&&!$('#dlg').open&&document.activeElement.tagName!='INPUT')listView()},60000);
boot();
</script></body></html>
